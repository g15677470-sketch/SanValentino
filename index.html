<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentino ❤️</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💖 San Valentino 💖</h1>
            <p class="subtitle">Un giorno speciale per chi ami</p>
        </header>

        <main>
            <section class="hero">
                <div class="heart"></div>
                <h2>Amore</h2>
                <p>Celebra il giorno più romantico dell'anno</p>
            </section>

            <section class="content">
                <div class="card">
                    <h3>💕 Sorprese</h3>
                    <p>Crea momenti indimenticabili</p>
                </div>
                <div class="card">
                    <h3>🌹 Romanticismo</h3>
                    <p>Esprimi i tuoi sentimenti</p>
                </div>
                <div class="card">
                    <h3>💝 Amore</h3>
                    <p>Condividi la dolcezza</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 San Valentino. Made with ❤️</p>
        </footer>
    </div>

    <script src="js/script.js"></script>

</html>
